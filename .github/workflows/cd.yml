name: CD Pipeline

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: schack/pam-approver

# Default-deny at the top; each job grants only the scopes it needs.
permissions: {}

# Serialize main builds so the newest commit cleanly owns the rolling `main`
# tag; cancel superseded PR runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      # Lint the shipped entrypoint (shellcheck is preinstalled on the runner).
      - name: Lint shell (shellcheck)
        run: shellcheck entrypoint.sh

      # Pin Node for reproducible test runs (no npm install — zero JS deps).
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"  # always the latest Active LTS, zero upkeep

      # entrypoint.sh env-validation / config.js rendering (pure POSIX sh).
      - name: Shell tests
        run: sh tests/entrypoint_test.sh

      # Pure helpers in public/app.js via Node's built-in runner.
      - name: JS tests
        run: |
          node --version
          node --test

      # Build the image and assert each route returns a single, correct
      # Content-Type (ubuntu-latest ships Docker).
      - name: Container header tests
        run: sh tests/nginx_headers_test.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write        # keyless cosign signing (Sigstore/OIDC)
      security-events: write # upload Trivy SARIF to the Security tab

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        # Emulation for the arm64 runtime-stage filesystem ops (rm, install)
        # when building on the amd64 runner. The assets stage runs natively on
        # $BUILDPLATFORM, so this only covers the cheap, non-compiling steps.
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `main` + `sha-<sha>` track every commit (HEAD, for testing). The
          # CalVer version tags and `latest` move only when a release is
          # published, so every advertised version maps to a changelog entry.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # Multi-arch so the image schedules on amd64 or arm64 GKE node pools.
          # The runtime image has no compiled code (static files on a prebuilt
          # per-arch nginx base), so arm64 adds only emulated filesystem ops,
          # not a second compile.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Embed a max-detail SLSA provenance attestation and an SBOM in the
          # pushed image. Only on real (pushed) builds — PRs stay a fast,
          # attestation-free build-gate with the plain docker exporter.
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The steps below run only on real (pushed) builds — there's no image in
      # the registry to sign or scan on a PR.
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Scan image (Trivy)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          # Report-only: base-image CVEs are often out of our control, so never
          # fail the build — findings surface in the Security tab.
          exit-code: '0'

      - name: Upload Trivy results
        if: github.event_name != 'pull_request'
        # Report-only: surfacing CVEs in the Security tab must never fail the
        # build (codeql-action's upload can flake on GITHUB_REF), and must never
        # block the release-assets job that depends on this one.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-results.sarif

  # On a published release, attach an SBOM plus a cosign-signed checksums file to
  # the GitHub Release. The image itself is already cosign-signed in GHCR; these
  # release-level assets are what Scorecard's Signed-Releases check inspects.
  release-assets:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload assets to the GitHub Release
      packages: read     # pull the image to generate its SBOM
      id-token: write    # cosign keyless signing of the checksums
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (SPDX) from the released image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          # We attach our own SBOM (and signed checksums) below; don't let the
          # action also auto-upload a second, differently-named SBOM asset.
          upload-release-assets: false

      - name: Sign and attach release artifacts
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.build.outputs.digest }}
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Record exactly which immutable image this release refers to.
          echo "${IMAGE}@${DIGEST}" > image-digest.txt
          # Checksums over the file assets, then keyless-sign them. cosign v3
          # outputs a Sigstore bundle via --bundle; the .sigstore.json suffix is
          # one Scorecard recognises as a signed release asset.
          sha256sum sbom.spdx.json image-digest.txt > checksums.txt
          cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
          gh release upload "$TAG" \
            sbom.spdx.json image-digest.txt checksums.txt checksums.txt.sigstore.json \
            --repo "$GITHUB_REPOSITORY" --clobber
